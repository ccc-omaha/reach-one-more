[build]
  publish = "."
  command = "node build.js"

[[redirects]]
  from = "/stories"
  to = "/#stories"
  status = 301
[[redirects]]
  from = "/stories/*"
  to = "/#stories"
  status = 301
[[redirects]]
  from = "/faq"
  to = "/#faq"
  status = 301
[[redirects]]
  from = "/commit"
  to = "/"
  status = 301
[[redirects]]
  from = "/resources"
  to = "/"
  status = 301
