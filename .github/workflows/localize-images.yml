name: Localize images
on:
  push:
    paths: ['.github/workflows/localize-images.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/localize-images.sh
      - run: ls -la images
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add images index.html
          git commit -m "Host images locally instead of Squarespace CDN" || echo "nothing to commit"
          git push
